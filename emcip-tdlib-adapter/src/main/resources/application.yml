server:
  port: 9080

spring:
  application:
    name: emcip-tdlib-adapter
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}

tdlib:
  base-directory: ${TDLIB_BASE_DIR:tdlib-db}
  use-file-database: true
  use-chat-info-database: true
  use-message-database: true
  use-secret-chats: false
  log-verbosity-level: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
  level:
    io.emcip: INFO
    io.emcip.tdlib.adapter: DEBUG
