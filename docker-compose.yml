version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecip-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 14001
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "14001:14001"
    networks:
      - data-tier

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecip-kafka
    depends_on:
      - zookeeper
    ports:
      - "14002:14002"
      - "14003:14003"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:14001
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:14002,PLAINTEXT_HOST://localhost:14003
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - data-tier

  # Kafka UI for monitoring (optional)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecip-kafka-ui
    depends_on:
      - kafka
    ports:
      - "14004:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:14002
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:14001
    networks:
      - data-tier

  # PostgreSQL Database
  postgres:
    build:
      context: ./docker/postgres-knowledge
      dockerfile: Dockerfile
    container_name: ecip-postgres
    environment:
      POSTGRES_USER: emcip
      POSTGRES_PASSWORD: emcip
      POSTGRES_DB: emcip
    ports:
      - "14005:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emcip"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Admin (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecip-pgadmin
    depends_on:
      - postgres
    ports:
      - "14006:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecip.io
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    networks:
      - data-tier

  # Conversation Context Service
  conversation-context:
    build:
      context: .
      dockerfile: emcip-conversation-context/Dockerfile
    container_name: ecip-conversation-context
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "9081:9081"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:14002
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/emcip
      - SPRING_DATASOURCE_USERNAME=emcip
      - SPRING_DATASOURCE_PASSWORD=emcip
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ecip-tempo:4318
    networks:
      - app-tier
      - data-tier
    profiles:
      - full

  # Intent Classifier
  intent-classifier:
    build:
      context: .
      dockerfile: emcip-intent-classifier/Dockerfile
    container_name: ecip-intent-classifier
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "9082:9082"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:14002
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ecip-tempo:4318
    networks:
      - app-tier
      - data-tier
    profiles:
      - full

  # Policy Engine
  policy-engine:
    build:
      context: .
      dockerfile: emcip-policy-engine/Dockerfile
    container_name: ecip-policy-engine
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "9083:9083"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:14002
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/emcip
      - SPRING_DATASOURCE_USERNAME=emcip
      - SPRING_DATASOURCE_PASSWORD=emcip
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ecip-tempo:4318
    networks:
      - app-tier
      - data-tier
    profiles:
      - full

  # LLM Orchestrator — handles policy decisions that require AI responses
  # Requires ANTHROPIC_API_KEY in .env
  llm-orchestrator:
    build:
      context: .
      dockerfile: emcip-llm-orchestrator/Dockerfile
    container_name: ecip-llm-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "9084:9084"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:14002
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/emcip
      - SPRING_DATASOURCE_USERNAME=emcip
      - SPRING_DATASOURCE_PASSWORD=emcip
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ecip-tempo:4318
    networks:
      - app-tier
      - data-tier
    profiles:
      - llm

  # Moderation Service
  moderation-service:
    build:
      context: .
      dockerfile: emcip-moderation-service/Dockerfile
    container_name: ecip-moderation-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "9085:9085"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:14002
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/emcip
      - SPRING_R2DBC_USERNAME=emcip
      - SPRING_R2DBC_PASSWORD=emcip
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgres:5432/emcip
      - SPRING_DATASOURCE_USERNAME=emcip
      - SPRING_DATASOURCE_PASSWORD=emcip
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ecip-tempo:4318
    networks:
      - app-tier
      - data-tier

  # Audit Service
  audit-service:
    build:
      context: .
      dockerfile: emcip-audit-service/Dockerfile
    container_name: ecip-audit-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "9086:9086"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:14002
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/emcip
      - SPRING_R2DBC_USERNAME=emcip
      - SPRING_R2DBC_PASSWORD=emcip
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgres:5432/emcip
      - SPRING_DATASOURCE_USERNAME=emcip
      - SPRING_DATASOURCE_PASSWORD=emcip
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ecip-tempo:4318
    networks:
      - app-tier
      - data-tier

  # Admin API
  admin-api:
    build:
      context: .
      dockerfile: emcip-admin-api/Dockerfile
    container_name: ecip-admin-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9087:9087"
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/emcip
      - SPRING_R2DBC_USERNAME=emcip
      - SPRING_R2DBC_PASSWORD=emcip
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgres:5432/emcip
      - SPRING_DATASOURCE_USERNAME=emcip
      - SPRING_DATASOURCE_PASSWORD=emcip
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-changeme-in-production-32chars-secret}
      - ADMIN_SERVICE_TOKEN=${ADMIN_SERVICE_TOKEN:-internal-service-token}
      - SERVICE_TDLIB_URL=http://ecip-tdlib-adapter:9080
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ecip-tempo:4318
    networks:
      - app-tier
      - data-tier

  # Knowledge Engine — ontology-driven knowledge management
  knowledge-engine:
    build:
      context: .
      dockerfile: emcip-knowledge-engine/Dockerfile
    container_name: ecip-knowledge-engine
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "9088:9088"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:14002
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/emcip
      - SPRING_DATASOURCE_USERNAME=emcip
      - SPRING_DATASOURCE_PASSWORD=emcip
      - LLM_ORCHESTRATOR_URL=http://ecip-llm-orchestrator:9084
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ecip-tempo:4318
    networks:
      - app-tier
      - data-tier
    profiles:
      - full

  # TDLib Telegram adapter
  # Requires TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_PHONE_NUMBER in .env
  # First startup builds TDLib from source (~15-30 min). Result is cached.
  tdlib-adapter:
    build:
      context: .
      dockerfile: emcip-tdlib-adapter/Dockerfile
    container_name: ecip-tdlib-adapter
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "9080:9080"
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE_NUMBER=${TELEGRAM_PHONE_NUMBER:-}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:14002
      - TDLIB_DB_DIR=/app/tdlib-db
      - TDLIB_FILES_DIR=/app/tdlib-files
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ecip-tempo:4318
      - ADMIN_SERVICE_TOKEN=${ADMIN_SERVICE_TOKEN}
    volumes:
      - tdlib-data:/app/tdlib-db
      - tdlib-files:/app/tdlib-files
    networks:
      - app-tier
      - data-tier
    profiles:
      - telegram

  # Loki — log aggregation backend
  loki:
    image: grafana/loki:3.0.0
    container_name: ecip-loki
    ports:
      - "14008:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-tier
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Promtail — log shipper (Docker container logs → Loki)
  promtail:
    image: grafana/promtail:3.0.0
    container_name: ecip-promtail
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-tier

  # Prometheus — metrics scraping (http://localhost:14010)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ecip-prometheus
    ports:
      - "14010:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - app-tier
      - monitoring-tier
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Grafana — dashboards (http://localhost:14007, admin/admin)
  grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: ecip-grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    ports:
      - "14007:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring-tier

  # Admin UI — React SPA served by Spring Boot (http://localhost:14009)
  admin-ui:
    build:
      context: .
      dockerfile: emcip-admin-ui/Dockerfile
    container_name: ecip-admin-ui
    depends_on:
      - admin-api
    ports:
      - "14009:14009"
    networks:
      - app-tier

  # Tempo — distributed trace backend (http://localhost:14011)
  tempo:
    image: grafana/tempo:2.4.0
    container_name: ecip-tempo
    ports:
      - "14011:3200"
    volumes:
      - ./config/tempo-config.yml:/etc/tempo/config.yml
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/config.yml
    networks:
      - app-tier
      - monitoring-tier
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  tdlib-data:
  tdlib-files:
  loki-data:
  grafana-data:
  prometheus-data:
  tempo-data:

networks:
  data-tier:
    driver: bridge
  app-tier:
    driver: bridge
  monitoring-tier:
    driver: bridge
