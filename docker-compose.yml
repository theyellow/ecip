version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecip-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 14001
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "14001:14001"
    networks:
      - ecip-network

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecip-kafka
    depends_on:
      - zookeeper
    ports:
      - "14002:14002"
      - "14003:14003"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:14001
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:14002,PLAINTEXT_HOST://localhost:14003
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - ecip-network

  # Kafka UI for monitoring (optional)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecip-kafka-ui
    depends_on:
      - kafka
    ports:
      - "14004:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:14002
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:14001
    networks:
      - ecip-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecip-postgres
    environment:
      POSTGRES_USER: emcip
      POSTGRES_PASSWORD: emcip
      POSTGRES_DB: emcip
    ports:
      - "14005:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emcip"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Admin (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecip-pgadmin
    depends_on:
      - postgres
    ports:
      - "14006:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecip.io
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    networks:
      - ecip-network

  # TDLib Telegram adapter
  # Requires TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_PHONE_NUMBER in .env
  # First startup builds TDLib from source (~15-30 min). Result is cached.
  tdlib-adapter:
    build: ./emcip-tdlib-adapter
    container_name: ecip-tdlib-adapter
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "9080:9080"
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE_NUMBER=${TELEGRAM_PHONE_NUMBER:-}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:14002
      - TDLIB_DB_DIR=/app/tdlib-db
      - TDLIB_FILES_DIR=/app/tdlib-files
    volumes:
      - tdlib-data:/app/tdlib-db
      - tdlib-files:/app/tdlib-files
    networks:
      - ecip-network
    profiles:
      - telegram

volumes:
  postgres-data:
  tdlib-data:
  tdlib-files:

networks:
  ecip-network:
    driver: bridge
