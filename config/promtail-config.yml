server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ecip-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - ecip-tdlib-adapter
              - ecip-conversation-context
              - ecip-intent-classifier
              - ecip-policy-engine
              - ecip-llm-orchestrator
              - ecip-moderation-service
              - ecip-audit-service
              - ecip-admin-api
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_name]
        regex: /ecip-(.*)
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            message: message
            trace_id: traceId
            span_id: spanId
            timestamp: "@timestamp"
      - labels:
          level:
          logger:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
