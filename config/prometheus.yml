global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'emcip-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'tdlib-adapter:9080'
          - 'conversation-context:9081'
          - 'intent-classifier:9082'
          - 'policy-engine:9083'
          - 'llm-orchestrator:9084'
          - 'moderation-service:9085'
          - 'audit-service:9086'
          - 'admin-api:9087'
          - 'knowledge-engine:9088'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: service
        replacement: '${1}'
