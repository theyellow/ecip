name: Java CI with Maven

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'ecip-**', 'chore/**' ]
    paths-ignore:
      - 'docs/**'
      - 'documentation/**'
      - 'helm/**'
      - '*.md'
      - '.github/workflows/build-images.yml'
  # No paths-ignore here — deliberately. A workflow that a path filter prevents from
  # triggering reports NO status at all, and a required check that never reports leaves
  # the PR permanently at "Expected — waiting for status to be reported". The same
  # exclusions are applied inside the workflow by the `changes` job instead, where a
  # skipped job still reports a conclusion. See P3.5a.
  pull_request:
    branches: [ main ]

jobs:
  # Decides whether this PR touches anything that needs a build. Expressed as
  # negations with predicate-quantifier 'every' (a file counts only if it matches
  # ALL patterns), so the filter is fail-closed: any path not named below — including
  # one nobody anticipated — is treated as code and runs the full build. An allowlist
  # of code paths would fail open, which is the defect class recorded in P3.4.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!docs/**'
              - '!documentation/**'
              - '!helm/**'
              - '!**/*.md'
              - '!.github/workflows/build-images.yml'

      # A `changes` job that *succeeds* with an empty or malformed output (e.g. the
      # filter key gets renamed without updating `outputs:` above) is indistinguishable
      # from a legitimate 'false' to `build`/`code-quality`'s `if:` — both skip, and
      # ci-gate reports SUCCESS. That would silently disable the whole build gate while
      # looking identical to the docs-only fast path. Same defect class as P3.4's
      # `${surefireArgLine}`. Hard-fail on anything but a real boolean so it can't happen.
      - name: Report decision
        run: |
          echo "code=${{ steps.filter.outputs.code }}"
          case "${{ steps.filter.outputs.code }}" in
            true|false) ;;
            *) echo "::error::paths-filter produced an unusable value — refusing to let the gate pass silently"; exit 1 ;;
          esac

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven (no tests)
      run: mvn -B clean install -DskipTests --file pom.xml

    # `verify` (not `test`) so maven-failsafe runs the *IT / *IntegrationTest classes and
    # the admin-ui npm-test execution runs vitest. Replaces the former `mvn test` step plus
    # the hardcoded `-Dtest=Audit...IT` list, which only covered 4 of the 15 IT classes and
    # silently omitted every new one (e.g. AdminAuditEventPersistenceIT from P2.8).
    # Testcontainers-backed ITs use the Docker daemon preinstalled on ubuntu-latest.
    - name: Run tests (unit + integration + frontend)
      run: mvn -B verify --file pom.xml

    - name: Verify coverage wiring
      run: ./scripts/check-coverage-wiring.sh

    - name: Upload coverage to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: '**/target/site/jacoco'

    - name: Run Spotless check
      run: mvn -B spotless:check --file pom.xml

    - name: Run PMD
      run: mvn -B pmd:check --file pom.xml

  # Separate job for code quality to run in parallel
  code-quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build and install
      run: mvn -B clean install -DskipTests --file pom.xml

    - name: Spotless check
      run: mvn -B spotless:check --file pom.xml

    - name: PMD
      run: mvn -B pmd:check --file pom.xml

  # The single required status check for this workflow (P3.5a). It runs on every PR
  # without exception, so it always reports a conclusion and can never deadlock a PR.
  #   skipped   -> passes (the docs-only path; that is the whole point)
  #   failure   -> fails
  #   cancelled -> fails
  # `changes` is in `needs` so that a failure of the filter job itself fails the gate
  # rather than skipping the build and reporting green.
  ci-gate:
    name: ci-gate
    if: always()
    # This `needs` list IS the gate's definition. Any job added to this workflow but
    # not listed here gates nothing — it can fail or hang and ci-gate reports green
    # regardless. Keep this in sync whenever a job is added (e.g. the planned Gatling
    # job, ROADMAP 3.5).
    needs: [changes, build, code-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        run: |
          echo "results: ${{ join(needs.*.result, ',') }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::An upstream job failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::An upstream job was cancelled"
            exit 1
          fi
          echo "All upstream jobs succeeded or were skipped"
