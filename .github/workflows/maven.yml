name: Java CI with Maven

on:
  push:
    branches: [ main, 'feature/**', 'ecip-**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven (no tests)
      run: mvn -B clean install -DskipTests --file pom.xml

    - name: Run tests
      run: mvn -B test --file pom.xml

    - name: Generate JaCoCo coverage report
      run: mvn -B jacoco:report --file pom.xml

    - name: Upload coverage to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: '**/target/site/jacoco'

    - name: Run Spotless check
      run: mvn -B spotless:check --file pom.xml

    - name: Run Checkstyle
      run: mvn -B checkstyle:check --file pom.xml

    - name: Run PMD
      run: mvn -B pmd:check --file pom.xml

  # Separate job for code quality to run in parallel
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build and install
      run: mvn -B clean install -DskipTests --file pom.xml

    - name: Spotless check
      run: mvn -B spotless:check --file pom.xml

    - name: Checkstyle
      run: mvn -B checkstyle:check --file pom.xml

    - name: PMD
      run: mvn -B pmd:check --file pom.xml
