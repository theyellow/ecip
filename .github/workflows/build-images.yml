name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: 'Rebuild all services regardless of file changes'
        type: boolean
        default: false
      rebuild_postgres:
        description: 'Rebuild custom postgres image (pgvector + AGE) — slow, only when Dockerfile or extensions change'
        type: boolean
        default: false

env:
  IMAGE_PREFIX: ghcr.io/theyellow/ecip

jobs:

  detect-changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      jvm-only-matrix: ${{ steps.matrix.outputs.jvm-only }}
      jvm-latest-matrix: ${{ steps.matrix.outputs.jvm-latest }}
      native-matrix: ${{ steps.matrix.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Skip path detection on tag pushes — always rebuild everything
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          filters: |
            core:
              - 'emcip-core/**'
              - 'pom.xml'
            intent-classifier:
              - 'emcip-intent-classifier/**'
            moderation-service:
              - 'emcip-moderation-service/**'
            audit-service:
              - 'emcip-audit-service/**'
            admin-api:
              - 'emcip-admin-api/**'
            admin-ui:
              - 'emcip-admin-ui/**'
            tdlib-adapter:
              - 'emcip-tdlib-adapter/**'
            policy-engine:
              - 'emcip-policy-engine/**'
            conversation-context:
              - 'emcip-conversation-context/**'
            llm-orchestrator:
              - 'emcip-llm-orchestrator/**'
            knowledge-engine:
              - 'emcip-knowledge-engine/**'

      - name: Build service matrices
        id: matrix
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          FORCE_ALL: ${{ inputs.force_rebuild_all }}
          FILTER_CORE: ${{ steps.filter.outputs.core }}
          FILTER_INTENT_CLASSIFIER: ${{ steps.filter.outputs.intent-classifier }}
          FILTER_MODERATION_SERVICE: ${{ steps.filter.outputs.moderation-service }}
          FILTER_AUDIT_SERVICE: ${{ steps.filter.outputs.audit-service }}
          FILTER_ADMIN_API: ${{ steps.filter.outputs.admin-api }}
          FILTER_ADMIN_UI: ${{ steps.filter.outputs.admin-ui }}
          FILTER_TDLIB_ADAPTER: ${{ steps.filter.outputs.tdlib-adapter }}
          FILTER_POLICY_ENGINE: ${{ steps.filter.outputs.policy-engine }}
          FILTER_CONVERSATION_CONTEXT: ${{ steps.filter.outputs.conversation-context }}
          FILTER_LLM_ORCHESTRATOR: ${{ steps.filter.outputs.llm-orchestrator }}
          FILTER_KNOWLEDGE_ENGINE: ${{ steps.filter.outputs.knowledge-engine }}
        run: |
          # On tag push or manual force, rebuild everything
          if [[ "$IS_TAG" == "true" || "$FORCE_ALL" == "true" ]]; then
            CORE=true
            INTENT_CLASSIFIER=true MODERATION_SERVICE=true AUDIT_SERVICE=true
            ADMIN_API=true ADMIN_UI=true TDLIB_ADAPTER=true
            POLICY_ENGINE=true CONVERSATION_CONTEXT=true LLM_ORCHESTRATOR=true KNOWLEDGE_ENGINE=true
          else
            CORE="$FILTER_CORE"
            INTENT_CLASSIFIER="$FILTER_INTENT_CLASSIFIER"
            MODERATION_SERVICE="$FILTER_MODERATION_SERVICE"
            AUDIT_SERVICE="$FILTER_AUDIT_SERVICE"
            ADMIN_API="$FILTER_ADMIN_API"
            ADMIN_UI="$FILTER_ADMIN_UI"
            TDLIB_ADAPTER="$FILTER_TDLIB_ADAPTER"
            POLICY_ENGINE="$FILTER_POLICY_ENGINE"
            CONVERSATION_CONTEXT="$FILTER_CONVERSATION_CONTEXT"
            LLM_ORCHESTRATOR="$FILTER_LLM_ORCHESTRATOR"
            KNOWLEDGE_ENGINE="$FILTER_KNOWLEDGE_ENGINE"
          fi

          # Returns true if this service or core changed
          needs_build() { [[ "$CORE" == "true" || "$1" == "true" ]]; }

          JVM_ONLY='[]'
          needs_build "$INTENT_CLASSIFIER"    && JVM_ONLY=$(echo "$JVM_ONLY" | jq '. += [{"service":"intent-classifier","module":"emcip-intent-classifier","multiarch":true}]')
          needs_build "$MODERATION_SERVICE"   && JVM_ONLY=$(echo "$JVM_ONLY" | jq '. += [{"service":"moderation-service","module":"emcip-moderation-service","multiarch":true}]')
          needs_build "$AUDIT_SERVICE"        && JVM_ONLY=$(echo "$JVM_ONLY" | jq '. += [{"service":"audit-service","module":"emcip-audit-service","multiarch":true}]')
          needs_build "$ADMIN_API"            && JVM_ONLY=$(echo "$JVM_ONLY" | jq '. += [{"service":"admin-api","module":"emcip-admin-api","multiarch":true}]')
          # admin-ui uses frontend-maven-plugin which downloads a platform-specific Node binary —
          # cross-compilation via QEMU fails. amd64-only is sufficient (JVM JAR is platform-independent).
          needs_build "$ADMIN_UI"             && JVM_ONLY=$(echo "$JVM_ONLY" | jq '. += [{"service":"admin-ui","module":"emcip-admin-ui","multiarch":false}]')
          # tdlib-adapter compiles TDLib C++ from source — cross-compiling for arm64 is not feasible
          needs_build "$TDLIB_ADAPTER"        && JVM_ONLY=$(echo "$JVM_ONLY" | jq '. += [{"service":"tdlib-adapter","module":"emcip-tdlib-adapter","multiarch":false}]')

          JVM_LATEST='[]'
          needs_build "$POLICY_ENGINE"        && JVM_LATEST=$(echo "$JVM_LATEST" | jq '. += [{"service":"policy-engine","module":"emcip-policy-engine","multiarch":true}]')
          needs_build "$CONVERSATION_CONTEXT" && JVM_LATEST=$(echo "$JVM_LATEST" | jq '. += [{"service":"conversation-context","module":"emcip-conversation-context","multiarch":true}]')
          needs_build "$LLM_ORCHESTRATOR"     && JVM_LATEST=$(echo "$JVM_LATEST" | jq '. += [{"service":"llm-orchestrator","module":"emcip-llm-orchestrator","multiarch":true}]')
          # knowledge-engine is a background enrichment service — JVM-only, no native build needed
          needs_build "$KNOWLEDGE_ENGINE"    && JVM_ONLY=$(echo "$JVM_ONLY" | jq '. += [{"service":"knowledge-engine","module":"emcip-knowledge-engine","multiarch":true}]')

          echo "jvm-only=$(echo "$JVM_ONLY" | jq -c .)"     >> "$GITHUB_OUTPUT"
          echo "jvm-latest=$(echo "$JVM_LATEST" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "native=$(echo "$JVM_LATEST" | jq -c .)"     >> "$GITHUB_OUTPUT"

  build-jvm-only:
    name: Build JVM-only (${{ matrix.service }})
    needs: detect-changes
    if: needs.detect-changes.outputs.jvm-only-matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.jvm-only-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          platforms: ${{ matrix.multiarch && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ inputs.force_rebuild_all == true }}
          cache-from: type=gha,scope=${{ matrix.service }}-jvm
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-jvm

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service }}-jvm

  build-jvm-latest:
    name: Build JVM-latest (${{ matrix.service }})
    needs: detect-changes
    if: needs.detect-changes.outputs.jvm-latest-matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.jvm-latest-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=raw,value=jvm-staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=jvm-latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}-jvm

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          platforms: ${{ matrix.multiarch && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ inputs.force_rebuild_all == true }}
          cache-from: type=gha,scope=${{ matrix.service }}-jvm-latest
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-jvm-latest

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service }}-jvm-latest

  build-native-amd64:
    name: Build native-amd64 (${{ matrix.service }})
    needs: detect-changes
    if: needs.detect-changes.outputs.native-matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.native-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=raw,value=native-amd64-staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=native-amd64,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}-native-amd64

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile.native
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ inputs.force_rebuild_all == true }}
          # Registry cache for native builds: persists across runs, avoids GHA 10 GB cache limit
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache-native
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache-native,mode=max

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service }}-native

  build-postgres:
    name: Build postgres (pgvector + AGE)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: changes
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" || "${{ inputs.rebuild_postgres }}" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD | grep -q "^docker/postgres-knowledge/"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: steps.changes.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.changes.outputs.build == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/postgres
          tags: |
            type=raw,value=16,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker/postgres-knowledge
          file: docker/postgres-knowledge/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ inputs.force_rebuild_all == true }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/postgres:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/postgres:buildcache,mode=max

      - name: Scan for vulnerabilities
        if: steps.changes.outputs.build == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/postgres@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: steps.changes.outputs.build == 'true' && always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-postgres
