name: Secret Scanning

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'ecip-**', 'chore/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so TruffleHog can scan all commits in the push/PR

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          extra_args: --only-verified
