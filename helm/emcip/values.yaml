# ============================================================
# EMCIP Helm Chart values
# ============================================================
# IMPORTANT: Never put secrets here.
# All secrets live in a Kubernetes Secret named 'emcip-secrets'.
# See documentation/operations-guide.adoc for creation instructions.

# Global image settings
image:
  registry: ""          # e.g. "registry.example.com/" — leave empty for Docker Hub
  pullPolicy: Always

# Storage — all PVCs use this StorageClass
# Using microk8s-hostpath for local single-node setup
storage:
  storageClassName: microk8s-hostpath
  postgres:
    size: 10Gi
  kafka:
    size: 20Gi
  loki:
    size: 10Gi
  grafana:
    size: 1Gi
  tdlibDb:
    size: 1Gi
  tdlibFiles:
    size: 5Gi

# Secret reference — name of the pre-created Kubernetes Secret
secretName: emcip-secrets

# Ingress
ingress:
  enabled: true
  className: nginx
  host: emcip.local

# ============================================================
# Application services
# Services listed here get a standard Deployment + ClusterIP Service.
# tdlib-adapter is separate (StatefulSet).
# ============================================================
services:
  conversationContext:
    name: conversation-context
    image: ghcr.io/theyellow/ecip/conversation-context:jvm-latest
    port: 9081
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  intentClassifier:
    name: intent-classifier
    image: ghcr.io/theyellow/ecip/intent-classifier:latest
    port: 9082
    replicas: 1
    nodeSelector: {}
    env:
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  policyEngine:
    name: policy-engine
    image: ghcr.io/theyellow/ecip/policy-engine:jvm-latest
    port: 9083
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  llmOrchestrator:
    name: llm-orchestrator
    image: ghcr.io/theyellow/ecip/llm-orchestrator:jvm-latest
    port: 9084
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
    secrets:
      ANTHROPIC_API_KEY: anthropic-api-key
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  moderationService:
    name: moderation-service
    image: ghcr.io/theyellow/ecip/moderation-service:latest
    port: 9085
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_R2DBC_URL: "r2dbc:postgresql://emcip-postgres:5432/emcip"
      SPRING_LIQUIBASE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  auditService:
    name: audit-service
    image: ghcr.io/theyellow/ecip/audit-service:latest
    port: 9086
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_R2DBC_URL: "r2dbc:postgresql://emcip-postgres:5432/emcip"
      SPRING_LIQUIBASE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  adminApi:
    name: admin-api
    image: ghcr.io/theyellow/ecip/admin-api:latest
    port: 9087
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_R2DBC_URL: "r2dbc:postgresql://emcip-postgres:5432/emcip"
      SPRING_LIQUIBASE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
      ADMIN_CORS_ALLOWED_ORIGINS: "http://emcip.local"
      SERVICE_TDLIB_URL: "http://emcip-tdlib-adapter:9080"
      SERVICE_ORCHESTRATOR_URL: "http://emcip-llm-orchestrator:9084"
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration"
    secrets:
      ADMIN_JWT_SECRET: admin-jwt-secret
      ADMIN_SERVICE_TOKEN: admin-service-token
      TELEGRAM_API_ID: telegram-api-id
      TELEGRAM_API_HASH: telegram-api-hash
    # R2DBC repository scanning + Spring context init takes ~90s on this JVM image.
    # Default failureThreshold of 12 (140s total) is not enough — raise to 30 (320s).
    startupFailureThreshold: 30
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  adminUi:
    name: admin-ui
    image: ghcr.io/theyellow/ecip/admin-ui:latest
    port: 14009
    replicas: 1
    nodeSelector: {}
    env: {}
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 384Mi

# tdlib-adapter is a StatefulSet (separate section — needs PVC for session state)
tdlibAdapter:
  name: tdlib-adapter
  image: ghcr.io/theyellow/ecip/tdlib-adapter:latest
  port: 9080
  replicas: 1
  nodeSelector: {}
  env:
    KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
  secrets:
    TELEGRAM_API_ID: telegram-api-id
    TELEGRAM_API_HASH: telegram-api-hash
    TELEGRAM_PHONE_NUMBER: telegram-phone-number
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Infrastructure image versions
infra:
  postgres:
    image: postgres:16-alpine
    port: 5432
  loki:
    image: grafana/loki:3.0.0
    port: 3100
  grafana:
    image: grafana/grafana-oss:11.0.0
    port: 3000
