# ============================================================
# EMCIP Helm Chart values
# ============================================================
# IMPORTANT: Never put secrets here.
# All secrets live in a Kubernetes Secret named 'emcip-secrets'.
# See documentation/operations-guide.adoc for creation instructions.

# Global image settings
image:
  registry: ""          # e.g. "registry.example.com/" — leave empty for Docker Hub
  pullPolicy: Always
  stage: staging        # Image tag stage: staging (main branch), latest (release tag), or semver e.g. v1.2.3
                        # Override at deploy time: helm upgrade ... --set image.stage=latest

# Storage — all PVCs use this StorageClass
# Using microk8s-hostpath for local single-node setup
storage:
  storageClassName: microk8s-hostpath
  postgres:
    size: 10Gi
  kafka:
    size: 20Gi
  loki:
    size: 10Gi
  grafana:
    size: 1Gi
  prometheus:
    size: 10Gi
  tempo:
    size: 10Gi
  tdlibDb:
    size: 1Gi
  tdlibFiles:
    size: 5Gi

# Secret reference — name of the pre-created Kubernetes Secret
secretName: emcip-secrets

# Ingress
ingress:
  enabled: true
  className: nginx
  host: emcip.local
  tls:
    # Set enabled: true to activate cert-manager TLS (self-signed, works offline).
    # Requires cert-manager to be installed in the cluster.
    enabled: false
    issuer: emcip-selfsigned

# ============================================================
# Application services
# Services listed here get a standard Deployment + ClusterIP Service.
# tdlib-adapter is separate (StatefulSet).
# ============================================================
services:
  conversationContext:
    name: conversation-context
    imageRepo: ghcr.io/theyellow/ecip/conversation-context
    imageVariant: jvm
    port: 9081
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://emcip-tempo:4318"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC"
    # Observed cold start: ~122s. Delay set to 140s to absorb slower starts under load.
    # TODO: re-measure under stress before tightening further.
    # Budget: 140s + 24×(10+5)s = 500s total.
    startupInitialDelay: 140
    startupTimeoutSeconds: 5
    startupFailureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  intentClassifier:
    name: intent-classifier
    imageRepo: ghcr.io/theyellow/ecip/intent-classifier
    imageVariant: ""
    port: 9082
    replicas: 1
    nodeSelector: {}
    env:
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://emcip-tempo:4318"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC"
    # Observed cold start: ~35s. Delay set to 45s.
    # TODO: re-measure under stress before tightening further.
    # Budget: 45s + 24×(10+5)s = 405s total.
    startupInitialDelay: 45
    startupTimeoutSeconds: 5
    startupFailureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  policyEngine:
    name: policy-engine
    imageRepo: ghcr.io/theyellow/ecip/policy-engine
    imageVariant: jvm
    port: 9083
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://emcip-tempo:4318"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC"
    secrets:
      ADMIN_SERVICE_TOKEN: admin-service-token
    # Observed cold start: ~154s. Delay set to 170s to absorb slower starts under load.
    # TODO: re-measure under stress before tightening further.
    # Budget: 170s + 24×(10+5)s = 530s total.
    startupInitialDelay: 170
    startupTimeoutSeconds: 5
    startupFailureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  llmOrchestrator:
    name: llm-orchestrator
    imageRepo: ghcr.io/theyellow/ecip/llm-orchestrator
    imageVariant: jvm
    port: 9084
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://emcip-tempo:4318"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC"
      # LiteLLM provider base_url and api_key are managed at runtime via the
      # Admin UI (AI Config page) and stored in llm_provider_config table.
      # No static API key secret needed here.
    secrets:
      ADMIN_SERVICE_TOKEN: admin-service-token
    # Observed cold start: ~55s. Delay set to 70s.
    # TODO: re-measure under stress before tightening further.
    # Budget: 70s + 24×(10+5)s = 430s total.
    startupInitialDelay: 70
    startupTimeoutSeconds: 5
    startupFailureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  moderationService:
    name: moderation-service
    imageRepo: ghcr.io/theyellow/ecip/moderation-service
    imageVariant: ""
    port: 9085
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_R2DBC_URL: "r2dbc:postgresql://emcip-postgres:5432/emcip"
      SPRING_LIQUIBASE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://emcip-tempo:4318"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC"
    secrets:
      ADMIN_SERVICE_TOKEN: admin-service-token
    # Observed cold start: ~101s. Delay set to 120s.
    # TODO: re-measure under stress before tightening further.
    # Budget: 120s + 24×(10+5)s = 480s total.
    startupInitialDelay: 120
    startupTimeoutSeconds: 5
    startupFailureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  auditService:
    name: audit-service
    imageRepo: ghcr.io/theyellow/ecip/audit-service
    imageVariant: ""
    port: 9086
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_R2DBC_URL: "r2dbc:postgresql://emcip-postgres:5432/emcip"
      SPRING_LIQUIBASE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://emcip-tempo:4318"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC"
    secrets:
      ADMIN_SERVICE_TOKEN: admin-service-token
    # Observed cold start: ~55s. Delay set to 70s.
    # TODO: re-measure under stress before tightening further.
    # Budget: 70s + 24×(10+5)s = 430s total.
    startupInitialDelay: 70
    startupTimeoutSeconds: 5
    startupFailureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  adminApi:
    name: admin-api
    imageRepo: ghcr.io/theyellow/ecip/admin-api
    imageVariant: ""
    port: 9087
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_R2DBC_URL: "r2dbc:postgresql://emcip-postgres:5432/emcip"
      SPRING_LIQUIBASE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://emcip-tempo:4318"
      ADMIN_CORS_ALLOWED_ORIGINS: "http://emcip.local"
      SERVICE_TDLIB_URL: "http://emcip-tdlib-adapter:9080"
      SERVICE_ORCHESTRATOR_URL: "http://emcip-llm-orchestrator:9084"
      MODERATION_SERVICE_URL: "http://emcip-moderation-service:9085"
      POLICY_ENGINE_URL: "http://emcip-policy-engine:9083"
      AUDIT_SERVICE_URL: "http://emcip-audit-service:9086"
      SERVICE_KNOWLEDGE_URL: "http://emcip-knowledge-engine:9088"
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC"
    secrets:
      ADMIN_JWT_SECRET: admin-jwt-secret
      ADMIN_SERVICE_TOKEN: admin-service-token
      TELEGRAM_API_ID: telegram-api-id
      TELEGRAM_API_HASH: telegram-api-hash
    # Observed cold start: ~60s (R2DBC+Liquibase, much faster than old JPA image).
    # Delay set to 75s. TODO: re-measure under stress before tightening further.
    # Budget: 75s + 12×(10+5)s = 255s total.
    startupInitialDelay: 75
    startupTimeoutSeconds: 5
    startupFailureThreshold: 12
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  knowledgeEngine:
    name: knowledge-engine
    imageRepo: ghcr.io/theyellow/ecip/knowledge-engine
    imageVariant: ""
    port: 9088
    replicas: 1
    nodeSelector: {}
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://emcip-postgres:5432/emcip"
      KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
      LLM_ORCHESTRATOR_URL: "http://emcip-llm-orchestrator:9084"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://emcip-tempo:4318"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC"
    secrets:
      ADMIN_SERVICE_TOKEN: admin-service-token
    # No cold-start measurement yet — using conservative estimate matching policy-engine.
    # TODO: measure actual startup time after first deployment.
    startupInitialDelay: 170
    startupTimeoutSeconds: 5
    startupFailureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  adminUi:
    name: admin-ui
    imageRepo: ghcr.io/theyellow/ecip/admin-ui
    imageVariant: ""
    port: 14009
    replicas: 1
    nodeSelector: {}
    env: {}
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 384Mi

# tdlib-adapter is a StatefulSet (separate section — needs PVC for session state)
tdlibAdapter:
  name: tdlib-adapter
  imageRepo: ghcr.io/theyellow/ecip/tdlib-adapter
  imageVariant: ""
  port: 9080
  replicas: 1
  nodeSelector: {}
  env:
    KAFKA_BOOTSTRAP_SERVERS: "emcip-kafka-bootstrap:9092"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://emcip-tempo:4318"
    APP_TENANT_ID: ""      # Set to the tenant UUID this adapter serves
  secrets:
    ADMIN_SERVICE_TOKEN: admin-service-token
    TELEGRAM_API_ID: telegram-api-id
    TELEGRAM_API_HASH: telegram-api-hash
    TELEGRAM_PHONE_NUMBER: telegram-phone-number
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Infrastructure image versions
infra:
  postgres:
    image: ghcr.io/theyellow/ecip/postgres:16
    port: 5432
  loki:
    image: grafana/loki:3.0.0
    port: 3100
  grafana:
    image: grafana/grafana-oss:11.0.0
    port: 3000
  prometheus:
    image: prom/prometheus:v2.52.0
    port: 9090
  tempo:
    image: grafana/tempo:2.4.0
    port: 3200
