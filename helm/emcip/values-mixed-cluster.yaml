# Mixed cluster values overlay: x86_64 + arm64 (Raspberry Pi 4)
#
# Deploy:
#   helm upgrade --install emcip helm/emcip/ \
#     -f helm/emcip/values-mixed-cluster.yaml -n emcip
#
# Prerequisites:
#   - native-amd64 images built and pushed (see scripts/build-images.sh --native amd64)
#   - JVM images built and pushed (see scripts/build-images.sh --jvm)

services:
  policyEngine:
    image: ghcr.io/theyellow/ecip/policy-engine:native-amd64
    nodeSelector:
      kubernetes.io/arch: amd64

  conversationContext:
    image: ghcr.io/theyellow/ecip/conversation-context:native-amd64
    nodeSelector:
      kubernetes.io/arch: amd64

  llmOrchestrator:
    image: ghcr.io/theyellow/ecip/llm-orchestrator:native-amd64
    nodeSelector:
      kubernetes.io/arch: amd64

tdlibAdapter:
  image: ghcr.io/theyellow/ecip/tdlib-adapter:latest   # libtdjni.so is amd64-only — must stay on amd64 nodes
  nodeSelector:
    kubernetes.io/arch: amd64
