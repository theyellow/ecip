{{- range $key, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emcip-{{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "emcip.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/component: application
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc.name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svc.name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      {{- if $svc.nodeSelector }}
      nodeSelector:
        {{- toYaml $svc.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ $.Values.image.registry }}{{ $svc.imageRepo }}:{{ if $svc.imageVariant }}{{ $svc.imageVariant }}-{{ end }}{{ $.Values.image.stage }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- range $envKey, $envVal := $svc.env }}
            - name: {{ $envKey }}
              value: {{ $envVal | quote }}
            {{- end }}
            {{- if ne $svc.name "admin-ui" }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: postgres-user
                  optional: true
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: postgres-password
                  optional: true
            - name: SPRING_R2DBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: postgres-user
                  optional: true
            - name: SPRING_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: postgres-password
                  optional: true
            - name: SPRING_LIQUIBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: postgres-user
                  optional: true
            - name: SPRING_LIQUIBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: postgres-password
                  optional: true
            {{- end }}
            {{- range $secretKey, $secretRef := $svc.secrets }}
            - name: {{ $secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ $secretRef }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.startupInitialDelay | default 20 }}
            periodSeconds: 10
            timeoutSeconds: {{ $svc.startupTimeoutSeconds | default 1 }}
            failureThreshold: {{ $svc.startupFailureThreshold | default 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $svc.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $svc.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: emcip-{{ $svc.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "emcip.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $svc.name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
