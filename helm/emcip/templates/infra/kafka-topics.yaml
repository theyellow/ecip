# KafkaTopic CRs for all EMCIP topics.
# Strimzi entity operator reconciles these into Kafka.
{{- $ns := .Release.Namespace }}
{{- $release := .Release.Name }}
{{- $chart := .Chart }}
{{- $appVersion := .Chart.AppVersion }}
{{- $topics := list
  "telegram.raw.messages"
  "telegram.raw.updates"
  "telegram.messages"
  "messages.classified"
  "policies.decisions"
  "responses.generated"
  "responses.pending"
  "moderation.flags"
  "moderation.actions"
  "commands.execute"
  "escalation.human"
  "review.pending"
  "knowledge.raw.messages"
  "knowledge.events"
}}
{{- range $topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ . | replace "." "-" }}
  namespace: {{ $ns }}
  labels:
    strimzi.io/cluster: emcip
    helm.sh/chart: {{ printf "%s-%s" $chart.Name $chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/version: {{ $appVersion | quote }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ $release }}
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000   # 7 days
    cleanup.policy: delete
{{- end }}
