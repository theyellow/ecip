apiVersion: apps/v1
kind: Deployment
metadata:
  name: emcip-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "emcip.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: loki
          image: {{ .Values.infra.loki.image }}
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - containerPort: {{ .Values.infra.loki.port }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.infra.loki.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.infra.loki.port }}
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: emcip-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: emcip-loki-data
