apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emcip-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "emcip.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: emcip-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.infra.postgres.image }}
          ports:
            - containerPort: {{ .Values.infra.postgres.port }}
          env:
            - name: POSTGRES_DB
              value: emcip
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: postgres-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "localhost", "-p", "5432"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "localhost", "-p", "5432"]
            initialDelaySeconds: 30
            periodSeconds: 10
      # NOTE: Uses a pre-provisioned PVC (not volumeClaimTemplates).
      # Multi-replica is NOT supported — all replicas would share the same PVC.
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: emcip-postgres-data
