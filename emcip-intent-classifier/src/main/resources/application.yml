server:
  port: 9082

spring:
  application:
    name: emcip-intent-classifier
  r2dbc:
    url: r2dbc:postgresql://localhost:14005/emcip
    username: emcip
    password: emcip
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}
    consumer:
      group-id: intent-classifier
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      fetch-min-size: 1
      fetch-max-wait: 500
      properties:
        max.poll.records: 500
    listener:
      ack-mode: manual_immediate

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: logstash
  level:
    io.emcip: INFO
