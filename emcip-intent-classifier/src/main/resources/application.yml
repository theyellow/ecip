server:
  port: 9082

spring:
  application:
    name: emcip-intent-classifier
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:14005/emcip?sslmode=${DB_SSL_MODE:disable}}
    username: ${SPRING_DATASOURCE_USERNAME:emcip}
    password: ${SPRING_DATASOURCE_PASSWORD:emcip}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}
    consumer:
      group-id: intent-classifier
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      fetch-min-size: 1
      fetch-max-wait: 500
      properties:
        max.poll.records: 500
    listener:
      ack-mode: manual_immediate

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  structured:
    format:
      console: logstash
  level:
    io.emcip: INFO
