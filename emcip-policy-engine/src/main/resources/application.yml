server:
  port: 9083

spring:
  application:
    name: emcip-policy-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:14005/emcip}
    username: ${SPRING_DATASOURCE_USERNAME:emcip}
    password: ${SPRING_DATASOURCE_PASSWORD:emcip}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    # Schema is owned by this service: policy_rules and policy_decisions tables.
    # Migrations: 001-create-policy-decisions, 002-create-policy-rules,
    #   003-add-performance-indexes, 004-add-tenant-id,
    #   005-policy-rule-versioning, 006-add-signal-status.
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}
    consumer:
      group-id: policy-engine
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

admin:
  service-token: ${ADMIN_SERVICE_TOKEN:internal-service-token}

logging:
  structured:
    format:
      console: logstash
  level:
    io.emcip: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
