server:
  port: 9084

spring:
  application:
    name: emcip-llm-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:14005/emcip
    username: emcip
    password: emcip
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}
    consumer:
      group-id: llm-orchestrator
      auto-offset-reset: earliest
      enable-auto-commit: false

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.emcip: INFO
