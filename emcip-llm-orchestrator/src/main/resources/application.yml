server:
  port: 9084

spring:
  application:
    name: emcip-llm-orchestrator

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:14005/emcip}
    username: ${SPRING_DATASOURCE_USERNAME:emcip}
    password: ${SPRING_DATASOURCE_PASSWORD:emcip}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}
    consumer:
      group-id: llm-orchestrator
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash
  level:
    io.emcip: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

knowledge:
  engine:
    base-url: ${KNOWLEDGE_ENGINE_URL:http://localhost:9088}
  enrichment:
    enabled: ${KNOWLEDGE_ENRICHMENT_ENABLED:false}
    relevance-threshold: ${KNOWLEDGE_RELEVANCE_THRESHOLD:0.70}
    max-results: ${KNOWLEDGE_MAX_RESULTS:5}
    context-max-chars: ${KNOWLEDGE_CONTEXT_MAX_CHARS:2000}
