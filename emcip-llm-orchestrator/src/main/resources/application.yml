server:
  port: 9084

spring:
  application:
    name: emcip-llm-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/emcip_llm
    username: emcip
    password: emcip
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.emcip: INFO
