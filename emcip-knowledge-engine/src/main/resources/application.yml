server:
  port: 9088

spring:
  application:
    name: emcip-knowledge-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:14005/emcip?sslmode=${DB_SSL_MODE:disable}}
    username: ${SPRING_DATASOURCE_USERNAME:emcip}
    password: ${SPRING_DATASOURCE_PASSWORD:emcip}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}
    consumer:
      group-id: knowledge-engine
      auto-offset-reset: earliest
      enable-auto-commit: false

knowledge:
  chunking:
    target-tokens: 300
    overlap-sentences: 2
    min-sentence-length: 20
    max-chunks: 500
    abbreviations: "Dr.,Prof.,Dipl.,Ing.,Str.,z.B.,bzw.,usw.,etc.,Nr.,Abs.,Art.,ggf.,ca.,d.h.,u.a.,o.ä.,i.d.R.,e.V.,GmbH.,AG."
  embedding:
    dimension: ${KNOWLEDGE_EMBEDDING_DIMENSION:1024}
  llm-orchestrator:
    base-url: ${LLM_ORCHESTRATOR_URL:http://localhost:9084}
  tdlib-adapter:
    base-url: ${TDLIB_ADAPTER_URL:http://localhost:9080}
  resolution:
    merge-threshold: ${KNOWLEDGE_RESOLUTION_MERGE_THRESHOLD:0.92}
    flag-threshold: ${KNOWLEDGE_RESOLUTION_FLAG_THRESHOLD:0.80}

web:
  search:
    enabled: ${WEB_SEARCH_ENABLED:false}
    searxng:
      base-url: ${SEARXNG_BASE_URL:}

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

admin:
  service-token: ${ADMIN_SERVICE_TOKEN:internal-service-token}

resilience4j:
  circuitbreaker:
    instances:
      llm-orchestrator-embed:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80
      llm-orchestrator-analyse:
        sliding-window-size: 10
        failure-rate-threshold: 70
        wait-duration-in-open-state: 120s
        permitted-number-of-calls-in-half-open-state: 5
        slow-call-duration-threshold: 180s
        slow-call-rate-threshold: 90
  retry:
    instances:
      llm-orchestrator-analyse:
        max-attempts: 2
        wait-duration: 10s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException

logging:
  structured:
    format:
      console: logstash
  level:
    io.emcip: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
