spring:
  kafka:
    consumer:
      auto-offset-reset: earliest

emcip:
  # Test-only key. Base64 of "0123456789abcdef0123456789abcdef" (32 bytes).
  secret-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

knowledge:
  chunking:
    target-tokens: 300
    overlap-sentences: 2
    min-sentence-length: 20
    max-chunks: 500
    abbreviations: "Dr.,Prof.,Dipl.,Ing.,Str.,z.B.,bzw.,usw.,etc.,Nr.,Abs.,Art.,ggf.,ca.,d.h.,u.a.,o.ä.,i.d.R.,e.V.,GmbH.,AG."
  embedding:
    dimension: 1024
  llm-orchestrator:
    base-url: http://localhost:${mockwebserver.port:9999}

logging:
  level:
    io.emcip: DEBUG
