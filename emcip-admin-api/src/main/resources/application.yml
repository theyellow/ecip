server:
  port: 9087

spring:
  application:
    name: emcip-admin-api
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:14005/emcip}
    username: ${SPRING_R2DBC_USERNAME:emcip}
    password: ${SPRING_R2DBC_PASSWORD:emcip}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}
  datasource:
    url: ${SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:14005/emcip}
    username: ${SPRING_DATASOURCE_USERNAME:emcip}
    password: ${SPRING_DATASOURCE_PASSWORD:emcip}
    driver-class-name: org.postgresql.Driver


management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET:changeme-in-production-32chars-secret}
  service-token: ${ADMIN_SERVICE_TOKEN:internal-service-token}
  cors:
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:14009}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
  level:
    io.emcip: INFO

service:
  tdlib:
    url: ${SERVICE_TDLIB_URL:http://localhost:9080}
  orchestrator:
    url: ${SERVICE_ORCHESTRATOR_URL:http://localhost:9084}

services:
  moderation-service:
    url: ${MODERATION_SERVICE_URL:http://localhost:9085}
  policy-engine:
    url: ${POLICY_ENGINE_URL:http://localhost:9083}
  audit-service:
    url: ${AUDIT_SERVICE_URL:http://localhost:9086}

telegram:
  api-id: ${TELEGRAM_API_ID:0}
  api-hash: ${TELEGRAM_API_HASH:}
