tdlib:
  adapters:
    - id: default
      url: ${TDLIB_ADAPTER_URL:http://localhost:9080}

server:
  port: 9087

spring:
  application:
    name: emcip-admin-api
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:14005/emcip?sslMode=${DB_SSL_MODE:disable}}
    username: ${SPRING_R2DBC_USERNAME:emcip}
    password: ${SPRING_R2DBC_PASSWORD:emcip}
  codec:
    max-in-memory-size: 20MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}
  datasource:
    url: ${SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:14005/emcip?sslmode=${DB_SSL_MODE:disable}}
    username: ${SPRING_LIQUIBASE_USERNAME:emcip}
    password: ${SPRING_LIQUIBASE_PASSWORD:emcip}
    driver-class-name: org.postgresql.Driver


management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET:changeme-in-production-32chars-secret}
  service-token: ${ADMIN_SERVICE_TOKEN:internal-service-token}
  cors:
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:14009}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
  level:
    io.emcip: INFO

service:
  tdlib:
    url: ${SERVICE_TDLIB_URL:http://localhost:9080}
  orchestrator:
    url: ${SERVICE_ORCHESTRATOR_URL:http://localhost:9084}
  knowledge:
    url: ${SERVICE_KNOWLEDGE_URL:http://localhost:9088}

services:
  moderation-service:
    url: ${MODERATION_SERVICE_URL:http://localhost:9085}
  policy-engine:
    url: ${POLICY_ENGINE_URL:http://localhost:9083}
  audit-service:
    url: ${AUDIT_SERVICE_URL:http://localhost:9086}
  intent-classifier:
    url: ${INTENT_CLASSIFIER_URL:http://localhost:9082}

telegram:
  api-id: ${TELEGRAM_API_ID:0}
  api-hash: ${TELEGRAM_API_HASH:}

resilience4j:
  ratelimiter:
    instances:
      auth:
        limit-for-period: 10
        limit-refresh-period: 60s
        timeout-duration: 0s
      llm-trigger:
        limit-for-period: 20
        limit-refresh-period: 60s
        timeout-duration: 0s
      admin-crud:
        limit-for-period: 100
        limit-refresh-period: 60s
        timeout-duration: 0s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
    instances:
      policy-engine:
        baseConfig: default
      audit-service:
        baseConfig: default
      moderation-service:
        baseConfig: default
      tdlib-adapter:
        baseConfig: default
      orchestrator:
        slidingWindowSize: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 120s
        permittedNumberOfCallsInHalfOpenState: 5
        slowCallDurationThreshold: 180s
        slowCallRateThreshold: 90
      knowledge:
        baseConfig: default
      intent-classifier:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
          - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException$Forbidden
    instances:
      policy-engine:
        baseConfig: default
      audit-service:
        baseConfig: default
      moderation-service:
        baseConfig: default
      tdlib-adapter:
        baseConfig: default
      orchestrator:
        baseConfig: default
      knowledge:
        baseConfig: default
      intent-classifier:
        baseConfig: default
