tdlib:
  adapters:
    - id: default
      url: ${TDLIB_ADAPTER_URL:http://localhost:9080}

server:
  port: 9087

spring:
  application:
    name: emcip-admin-api
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:14005/emcip?sslMode=${DB_SSL_MODE:disable}}
    username: ${SPRING_R2DBC_USERNAME:emcip}
    password: ${SPRING_R2DBC_PASSWORD:emcip}
  codec:
    max-in-memory-size: 20MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:14003}
  datasource:
    url: ${SPRING_LIQUIBASE_URL:jdbc:postgresql://localhost:14005/emcip?sslmode=${DB_SSL_MODE:disable}}
    username: ${SPRING_LIQUIBASE_USERNAME:emcip}
    password: ${SPRING_LIQUIBASE_PASSWORD:emcip}
    driver-class-name: org.postgresql.Driver


management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

emcip:
  security:
    # Position from the RIGHT of X-Forwarded-For that holds the real client IP.
    #
    # THIS VALUE DESCRIBES A DEPLOYMENT TOPOLOGY, NOT A PREFERENCE. It is only correct for the
    # proxy chain actually in front of admin-api, every unit test passes with a wrong value, and
    # both directions of being wrong are harmful:
    #   too high -> a client can prepend entries and mint a fresh rate-limit bucket per request
    #   too low  -> a proxy's own address is used and every client collapses into one bucket
    # Override it per environment (Helm: services.adminApi.env.EMCIP_SECURITY_TRUSTED_PROXY_HOPS)
    # and re-run the verification in docs/operations/rate-limiting.md whenever the ingress, the
    # BFF's forwarding, or anything else in the chain changes.
    #
    # Default 1 = a single proxy in front of admin-api. Verified 2026-08-09 against the dev
    # cluster, where nginx routes /api/** straight to admin-api (the BFF is NOT in that path).
    # It was 2 until then, which assumed a BFF hop that does not exist for /api/**; that made
    # every request fall back to the socket address, collapsing all callers into one bucket.
    trusted-proxy-hops: 1
  secrets:
    # warn | fail | off. Ships as warn everywhere: a hard failure would make the
    # Admin UI credentials-repair path unreachable. Promote an environment to fail
    # only after it has reported clean - see docs/operations/secrets-encryption.md
    self-check: ${EMCIP_SECRETS_SELF_CHECK:warn}

admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET:changeme-in-production-32chars-secret}
  service-token: ${ADMIN_SERVICE_TOKEN:internal-service-token}
  cors:
    allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:14009}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
  level:
    io.emcip: INFO

service:
  tdlib:
    url: ${SERVICE_TDLIB_URL:http://localhost:9080}
  orchestrator:
    url: ${SERVICE_ORCHESTRATOR_URL:http://localhost:9084}
  knowledge:
    url: ${SERVICE_KNOWLEDGE_URL:http://localhost:9088}

services:
  moderation-service:
    url: ${MODERATION_SERVICE_URL:http://localhost:9085}
  policy-engine:
    url: ${POLICY_ENGINE_URL:http://localhost:9083}
  audit-service:
    url: ${AUDIT_SERVICE_URL:http://localhost:9086}
  intent-classifier:
    url: ${INTENT_CLASSIFIER_URL:http://localhost:9082}

telegram:
  api-id: ${TELEGRAM_API_ID:0}
  api-hash: ${TELEGRAM_API_HASH:}

resilience4j:
  ratelimiter:
    instances:
      auth:
        limit-for-period: 10
        limit-refresh-period: 60s
        timeout-duration: 0s
      llm-trigger:
        limit-for-period: 20
        limit-refresh-period: 60s
        timeout-duration: 0s
      admin-crud:
        # 600/min per user. NOT a round-number guess: the Admin UI consumes ~50 req/min per
        # operator while merely sitting open (component polling), and an active navigation burst
        # goes well past 100 — the previous value, which made the UI 429 on every page.
        #
        # 100 was calibrated when this limiter was attached by hand to a few controller methods.
        # P3.6 made it the /api/** catch-all covering EVERY endpoint without re-deriving the
        # budget, so the scope grew by an order of magnitude while the number stayed put.
        # It is per-JWT-subject, so this is one operator's ceiling, not the platform's.
        limit-for-period: 600
        limit-refresh-period: 60s
        timeout-duration: 0s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
    instances:
      policy-engine:
        baseConfig: default
      audit-service:
        baseConfig: default
      moderation-service:
        baseConfig: default
      tdlib-adapter:
        baseConfig: default
      orchestrator:
        slidingWindowSize: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 120s
        permittedNumberOfCallsInHalfOpenState: 5
        slowCallDurationThreshold: 180s
        slowCallRateThreshold: 90
      knowledge-search:
        baseConfig: default
      knowledge-ingest:
        baseConfig: default
      intent-classifier:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadRequest
          - org.springframework.web.reactive.function.client.WebClientResponseException$NotFound
          - org.springframework.web.reactive.function.client.WebClientResponseException$Forbidden
    instances:
      policy-engine:
        baseConfig: default
      audit-service:
        baseConfig: default
      moderation-service:
        baseConfig: default
      tdlib-adapter:
        baseConfig: default
      orchestrator:
        baseConfig: default
      knowledge-search:
        baseConfig: default
      knowledge-ingest:
        baseConfig: default
      intent-classifier:
        baseConfig: default
